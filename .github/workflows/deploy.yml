name: Validate and deploy website

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build static bundle
        run: npm run build

      - name: Save static website
        uses: actions/upload-artifact@v4
        with:
          name: static-website
          path: out/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME || secrets.S3_BUCKET_NAME }}
    steps:
      - name: Check deployment configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          for name in AWS_REGION S3_BUCKET_NAME AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions configuration: $name. See README deployment setup."
              missing=1
            fi
          done
          exit "$missing"

      - name: Download static website
        uses: actions/download-artifact@v4
        with:
          name: static-website
          path: out/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync out/ "s3://$S3_BUCKET_NAME" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Set cache control for HTML files
        run: |
          aws s3 cp "s3://$S3_BUCKET_NAME" "s3://$S3_BUCKET_NAME" \
            --exclude "*" \
            --include "*.html" \
            --recursive \
            --metadata-directive REPLACE \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html"
